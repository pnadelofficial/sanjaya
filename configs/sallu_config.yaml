# sanjaya configuration
# Run with: sanjaya --config config.yaml
# Process a subset:  sanjaya --config config.yaml --chunk 1.1 1.2

work:
  title: "Catilina, iugurtha, orationes et epistulae excerptae de historiis"
  author: "Sallust"

source:
  file: "/Users/pnadel01/Desktop/sanjaya/data/phi0631.phi001.perseus-lat3.xml"    # path to TEI XML source, relative to this file
  xpath: ".//tei:p"              # XPath selecting the text subunits to annotate

output:
  dir: "/Users/pnadel01/Desktop/sanjaya/output/sallust"       # relative to this file

chunk_filter: "1"            # optional: string or list of chunk IDs to process
#   e.g. chunk_filter: ["1.1", "1.2"]

# templates:
#   dir: "src/sanjaya/templates" # optional: defaults to the bundled templates

annotators:
  - class: sanjaya.llm.annotators.GlossAnnotator
    args:
      base_url: "http://localhost:8080"
      language: "Latin"
      author: "Sallust"
      work: "Catilina, iugurtha, orationes et epistulae excerptae de historiis"
      # model: "gpt-4o"          # uncomment for hosted APIs
      # api_key: "sk-..."        # omit for local servers

  - class: sanjaya.llm.annotators.TranslationAnnotator
    args:
      base_url: "http://localhost:8080"
      language: "Latin"
      author: "Sallust"
      work: "Catilina, iugurtha, orationes et epistulae excerptae de historiis"
      # model: "gpt-4o"
      # api_key: "sk-..."
