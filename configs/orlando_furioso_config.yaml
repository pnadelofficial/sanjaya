# sanjaya configuration
# Run with: sanjaya --config config.yaml
#
# Points at a scoped-down source containing only Canto 1, stanzas 1-3
# (generated by experiments/orlando_furioso_sample_gen.py) for a quick
# smoke test. The full 46-canto TEI lives at
# experiments/experiment-data/orlando_furioso.tei.xml — swap source.file
# to that (and drop the stanza scoping) to run the whole poem.

work:
  title: "Orlando Furioso"
  author: "Ludovico Ariosto"

source:
  file: "../data/orlando_furioso_sample.tei.xml"    # path to TEI XML source, relative to this file
  xpath: ".//tei:lg[@type='stanza']"    # stanza-level subunits, per the canto(chunk)/stanza(annotation unit)/line design

output:
  dir: "../output/orlando_furioso"       # relative to this file

# templates:
#   dir: "src/sanjaya/templates" # optional: defaults to the bundled templates

annotators:
  # Plain LLM-backed glossing, not NLPGlossAnnotator: only an Ancient Greek
  # (grc) UD model is downloaded locally (see stanza_models/) — no Italian
  # pipeline has been set up/verified yet. Switch to NLPGlossAnnotator once
  # one is available.
  - class: sanjaya.llm.nlp_pipeline_annotators.NLPGlossAnnotator
    args:
      base_url: "http://100.109.184.11:8080"
      language: "Italian"
      author: "Ludovico Ariosto"
      work: "Orlando Furioso"
      prompt: sanjaya.llm.prompts.gloss_prompt_no_pos

  - class: sanjaya.llm.annotators.TranslationAnnotator
    args:
      base_url: "http://100.109.184.11:8080"
      language: "Italian"
      author: "Ludovico Ariosto"
      work: "Orlando Furioso"

  - class: sanjaya.llm.annotators.CommentAnnotator
    args:
      base_url: "http://100.109.184.11:8080"
      language: "Italian"
      author: "Ludovico Ariosto"
      work: "Orlando Furioso"
      classifier_prompt: sanjaya.llm.prompts.comment_classifier_prompt
      writer_prompt: sanjaya.llm.prompts.comment_writer_prompt
